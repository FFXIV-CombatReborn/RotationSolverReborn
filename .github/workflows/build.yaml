name: Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  Build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud Latest
        run: |
          $archivePath = Join-Path $env:TEMP "latest.zip"
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile $archivePath
          Expand-Archive -Force $archivePath -DestinationPath "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Restore NuGet Packages
        run: |
          dotnet restore --locked-mode RotationSolver/RotationSolver.csproj
          dotnet restore RotationSolver.GameData/RotationSolver.GameData.csproj

      - name: Build Plugin
        run: |
          dotnet build --no-restore -c Release RotationSolver/RotationSolver.csproj
          dotnet build --no-restore -c Release RotationSolver.GameData/RotationSolver.GameData.csproj
