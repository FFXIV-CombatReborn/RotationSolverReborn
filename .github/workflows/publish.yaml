name: Publish
on:
  push:
    tags:
      - '*.*.*.*'
jobs:
  Build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: true
          
      - name: Get Environment Variables
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            Write-Error "Invalid version tag '$tag'. Expected A.B.C.D numeric format."
            exit 1
          }
          "tag=$tag" | Out-File -Append -FilePath $Env:GITHUB_ENV

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud Latest
        run: |
          $archivePath = Join-Path $env:TEMP "latest.zip"
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile $archivePath
          Expand-Archive -Force $archivePath -DestinationPath "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Restore Nuget Packages for RSR
        run: dotnet restore --locked-mode RotationSolver/RotationSolver.csproj

      - name: Build Plugin
        run: dotnet build --no-restore -c Release RotationSolver/RotationSolver.csproj -p:AssemblyVersion=$env:tag -p:FileVersion=$env:tag -p:PackageVersion=$env:tag -p:InformationalVersion=$env:tag

      - name: Publish Plugin
        uses: softprops/action-gh-release@v3
        with:
          files: ./bin/Release/RotationSolver/latest.zip
          token: ${{ secrets.GITHUB_TOKEN }}
